plugins { id 'com.android.application' }

android {
    namespace 'ua.homin.messenger'
    compileSdk 34

    defaultConfig {
        applicationId "ua.homin.messenger"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Підписується debug-ключем, щоб APK одразу встановлювався.
            // Для Google Play підставте власний keystore.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.activity:activity:1.9.2'
}

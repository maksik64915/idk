<body>
<style>
/* ============================================================
   ГОМІН — design tokens
   Neutrals carry a jade bias; one warm copper counter-accent.
   ============================================================ */
:root{
  --bg:#E9F0EE;
  --shell:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F3F8F6;
  --surface-3:#E7EFED;
  --line:#DAE5E2;
  --line-soft:#E9F0EE;
  --ink:#0F1E1B;
  --ink-2:#3A4A46;
  --muted:#6C7B77;
  --faint:#93A19D;
  --accent:#0E9C8C;
  --accent-2:#0B7F72;
  --accent-ink:#FFFFFF;
  --accent-soft:#D8F1ED;
  --ember:#C25E36;
  --ember-soft:#F7E4DA;
  --danger:#C0392B;
  --bubble-in:#FFFFFF;
  --bubble-in-ink:var(--ink);
  --bubble-out-a:#12A797;
  --bubble-out-b:#0C8E86;
  --bubble-out-ink:#FFFFFF;
  --wall:#DCE8E5;
  --wall-dot:rgba(14,156,140,.14);
  --shadow-s:0 1px 2px rgba(12,40,36,.06), 0 2px 8px rgba(12,40,36,.05);
  --shadow-m:0 4px 14px rgba(12,40,36,.10), 0 12px 32px rgba(12,40,36,.08);
  --shadow-l:0 18px 50px rgba(9,30,27,.22);
  --scrim:rgba(9,24,21,.42);
  --glass:rgba(255,255,255,.82);

  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --sp:4px;
  --fs:1;
  --tab-h:62px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A100F;
    --shell:#0E1615;
    --surface:#141E1C;
    --surface-2:#1A2523;
    --surface-3:#22302D;
    --line:#243330;
    --line-soft:#1A2523;
    --ink:#E5EEEB;
    --ink-2:#BCCAC6;
    --muted:#8A9995;
    --faint:#63726E;
    --accent:#2FD3BD;
    --accent-2:#22B9A5;
    --accent-ink:#04231F;
    --accent-soft:#12332F;
    --ember:#E5875A;
    --ember-soft:#33211A;
    --danger:#E86A5C;
    --bubble-in:#1A2523;
    --bubble-in-ink:var(--ink);
    --bubble-out-a:#2AC9B4;
    --bubble-out-b:#17A491;
    --bubble-out-ink:#032220;
    --wall:#0B1211;
    --wall-dot:rgba(47,211,189,.10);
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 6px 18px rgba(0,0,0,.45);
    --shadow-l:0 20px 60px rgba(0,0,0,.6);
    --scrim:rgba(2,10,9,.66);
    --glass:rgba(14,22,21,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A100F;
  --shell:#0E1615;
  --surface:#141E1C;
  --surface-2:#1A2523;
  --surface-3:#22302D;
  --line:#243330;
  --line-soft:#1A2523;
  --ink:#E5EEEB;
  --ink-2:#BCCAC6;
  --muted:#8A9995;
  --faint:#63726E;
  --accent:#2FD3BD;
  --accent-2:#22B9A5;
  --accent-ink:#04231F;
  --accent-soft:#12332F;
  --ember:#E5875A;
  --ember-soft:#33211A;
  --danger:#E86A5C;
  --bubble-in:#1A2523;
  --bubble-in-ink:var(--ink);
  --bubble-out-a:#2AC9B4;
  --bubble-out-b:#17A491;
  --bubble-out-ink:#032220;
  --wall:#0B1211;
  --wall-dot:rgba(47,211,189,.10);
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 6px 18px rgba(0,0,0,.45);
  --shadow-l:0 20px 60px rgba(0,0,0,.6);
  --scrim:rgba(2,10,9,.66);
  --glass:rgba(14,22,21,.82);
  color-scheme:dark;
}
/* accent variants */
:root[data-accent="ember"]{ --accent:#C25E36; --accent-2:#A54B27; --accent-ink:#FFF; --accent-soft:#F7E4DA; --bubble-out-a:#CF6C42; --bubble-out-b:#A94E2A; --bubble-out-ink:#FFF; --wall-dot:rgba(194,94,54,.14);}
:root[data-theme="dark"][data-accent="ember"], :root:not([data-theme="light"])[data-accent="ember"]{ --accent:#F0956A; --accent-2:#D0764C; --accent-ink:#2A1108; --accent-soft:#33211A; --bubble-out-a:#E4885C; --bubble-out-b:#C06840; --bubble-out-ink:#2A1108; --wall-dot:rgba(240,149,106,.10);}
:root[data-accent="indigo"]{ --accent:#4C5FD7; --accent-2:#3B4BB8; --accent-ink:#FFF; --accent-soft:#E0E3FA; --bubble-out-a:#5568DE; --bubble-out-b:#3F50C0; --bubble-out-ink:#FFF; --wall-dot:rgba(76,95,215,.14);}
:root[data-theme="dark"][data-accent="indigo"], :root:not([data-theme="light"])[data-accent="indigo"]{ --accent:#8E9BFF; --accent-2:#6E7DE8; --accent-ink:#0B1030; --accent-soft:#1B2050; --bubble-out-a:#7C8AF5; --bubble-out-b:#5C6BD8; --bubble-out-ink:#0B1030; --wall-dot:rgba(142,155,255,.10);}
:root[data-accent="plum"]{ --accent:#A63D6E; --accent-2:#8A2E59; --accent-ink:#FFF; --accent-soft:#F7DEE9; --bubble-out-a:#B44878; --bubble-out-b:#8F3059; --bubble-out-ink:#FFF; --wall-dot:rgba(166,61,110,.14);}
:root[data-theme="dark"][data-accent="plum"], :root:not([data-theme="light"])[data-accent="plum"]{ --accent:#EE8AB4; --accent-2:#CE6A95; --accent-ink:#2C0A1B; --accent-soft:#331825; --bubble-out-a:#DC7CA6; --bubble-out-b:#B95C85; --bubble-out-ink:#2C0A1B; --wall-dot:rgba(238,138,180,.10);}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Onest', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:calc(15px * var(--fs));
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit;}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
input,textarea{background:none;border:0;outline:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
::selection{background:var(--accent-soft);color:var(--ink);}
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;font-variant-numeric:tabular-nums;}
.disp{font-family:'Unbounded', 'Onest', sans-serif;letter-spacing:-.02em;}
[hidden]{display:none !important;}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ---------- ambient desktop stage ---------- */
.stage{
  min-height:100dvh; display:grid; place-items:center; padding:0;
  background:
    radial-gradient(70% 55% at 18% 8%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
    radial-gradient(60% 50% at 88% 92%, color-mix(in srgb, var(--ember) 14%, transparent), transparent 72%),
    var(--bg);
}
.app{
  position:relative; width:100%; max-width:430px; height:100dvh; max-height:100dvh;
  background:var(--shell); overflow:hidden; display:flex; flex-direction:column;
  isolation:isolate;
}
@media (min-width:720px) and (min-height:760px){
  .stage{padding:26px;}
  .app{height:min(920px, calc(100dvh - 52px)); border-radius:38px; box-shadow:var(--shadow-l), 0 0 0 1px color-mix(in srgb, var(--ink) 8%, transparent);}
}

/* ---------- screen stack ---------- */
.screens{position:absolute;inset:0;overflow:hidden;}
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  background:var(--shell); will-change:transform,opacity;
}
.screen[hidden]{display:none;}
.screen.tabroot{padding-bottom:calc(var(--tab-h) + var(--safe-b));}
@keyframes pushIn{from{transform:translate3d(28%,0,0);opacity:.4} to{transform:translate3d(0,0,0);opacity:1}}
@keyframes pushOut{from{transform:translate3d(0,0,0);opacity:1} to{transform:translate3d(-16%,0,0);opacity:.5}}
@keyframes popIn{from{transform:translate3d(-16%,0,0);opacity:.5} to{transform:translate3d(0,0,0);opacity:1}}
@keyframes popOut{from{transform:translate3d(0,0,0);opacity:1} to{transform:translate3d(28%,0,0);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,10px,0)} to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.anim-pushIn{animation:pushIn .34s var(--ease) both;}
.anim-pushOut{animation:pushOut .34s var(--ease) both;}
.anim-popIn{animation:popIn .3s var(--ease) both;}
.anim-popOut{animation:popOut .3s var(--ease) both;}
.anim-fade{animation:fadeIn .22s var(--ease) both;}

/* ---------- top bar ---------- */
.topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  padding:calc(var(--safe-t) + 10px) 8px 10px;
  background:var(--glass); backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid var(--line-soft); position:relative; z-index:5;
}
.topbar .grow{flex:1 1 auto; min-width:0;}
.topbar h1{margin:0; font-size:calc(19px*var(--fs)); font-weight:600; letter-spacing:-.02em;}
.topbar .sub{font-size:calc(12px*var(--fs)); color:var(--muted); margin-top:1px; display:flex; align-items:center; gap:5px;}
.brand{font-family:'Unbounded',sans-serif;font-weight:600;font-size:calc(20px*var(--fs));letter-spacing:-.045em;}
.brand em{font-style:normal;color:var(--accent);}
.icon-btn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  transition:background .18s var(--ease), transform .18s var(--ease), color .18s var(--ease);
  flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn:active{transform:scale(.9);}
.icon-btn.accent{color:var(--accent);}
.icon-btn svg{width:22px;height:22px;}

/* ---------- search ---------- */
.searchwrap{padding:8px 14px 6px; flex:0 0 auto;}
.search{
  display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid transparent; border-radius:14px;padding:9px 12px;
  transition:border-color .2s var(--ease), background .2s var(--ease);
}
.search:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--surface);}
.search svg{width:18px;height:18px;color:var(--faint);flex:0 0 auto;}
.search input{flex:1;min-width:0;font-size:calc(14.5px*var(--fs));}
.search input::placeholder{color:var(--faint);}
.search .clear{color:var(--faint);display:none;}
.search.has .clear{display:block;}

/* ---------- avatars ---------- */
.av{
  position:relative;flex:0 0 auto;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  font-family:'Unbounded',sans-serif;font-weight:600;color:#fff;letter-spacing:-.02em;user-select:none;
  background:var(--accent);
}
.av img{width:100%;height:100%;object-fit:cover;display:block;}
.av.s{width:34px;height:34px;font-size:13px;}
.av.m{width:52px;height:52px;font-size:19px;}
.av.l{width:82px;height:82px;font-size:30px;}
.av.xl{width:112px;height:112px;font-size:40px;}
.dot-on{
  position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;
  background:#31C48D;border:2.5px solid var(--shell);
}
.av.l + .dot-on{right:4px;bottom:4px;width:16px;height:16px;border-width:3px;}
.av.xl + .dot-on{right:7px;bottom:7px;width:19px;height:19px;border-width:3.5px;}
.avwrap{position:relative;flex:0 0 auto;}

/* ---------- chat list ---------- */
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.list{padding:2px 0 16px;}
.row{
  display:flex;align-items:center;gap:12px;padding:9px 14px;width:100%;text-align:left;
  transition:background .16s var(--ease);position:relative;
}
.row:active{background:var(--surface-2);}
.row + .row::before{content:'';position:absolute;left:78px;right:0;top:0;height:1px;background:var(--line-soft);}
.row .body{flex:1;min-width:0;}
.row .line1{display:flex;align-items:baseline;gap:8px;}
.row .name{font-weight:600;font-size:calc(15.5px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.row .time{font-size:calc(11.5px*var(--fs));color:var(--faint);flex:0 0 auto;}
.row .line2{display:flex;align-items:center;gap:7px;margin-top:2px;}
.row .prev{flex:1;min-width:0;color:var(--muted);font-size:calc(13.5px*var(--fs));display:flex;align-items:center;gap:5px;}
.row .prev .pv{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .prev .tick{flex:0 0 auto;display:inline-flex;color:var(--faint);}
.row .prev .tick.read{color:var(--accent);}
.row .prev .tick svg{width:15px;height:15px;}
.row .prev svg{width:14px;height:14px;flex:0 0 auto;opacity:.8;}
.row.unread .prev{color:var(--ink-2);}
.row.unread .name{font-weight:700;}
.badge{
  min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
  font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;
  animation:pop .28s var(--ease) both;
}
.badge.muted{background:var(--faint);}
@keyframes pop{from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1}}
.pin{width:14px;height:14px;color:var(--faint);flex:0 0 auto;display:grid;place-items:center;}
.pin svg{width:14px;height:14px;}
.tag{
  font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--faint);flex:0 0 auto;
}
.section-h{
  padding:16px 16px 6px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
}

/* ---------- tab bar ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  display:flex;padding:6px 8px calc(6px + var(--safe-b));
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-top:1px solid var(--line-soft);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);
  transition:color .2s var(--ease);position:relative;
}
.tab svg{width:23px;height:23px;transition:transform .3s var(--ease);}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.01em;}
.tab.on{color:var(--accent);}
.tab.on svg{transform:translateY(-1px) scale(1.06);}
.tab .nub{position:absolute;top:0;width:18px;height:3px;border-radius:2px;background:var(--accent);opacity:0;transform:scaleX(.3);transition:.3s var(--ease);}
.tab.on .nub{opacity:1;transform:none;}
.tab .cnt{
  position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;
  background:var(--ember);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;
}

/* ---------- FAB ---------- */
.fab{
  position:absolute;right:16px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);z-index:15;
  width:56px;height:56px;border-radius:19px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--bubble-out-a),var(--bubble-out-b));color:var(--accent-ink);
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 38%,transparent);
  transition:transform .22s var(--ease), box-shadow .22s var(--ease);
  animation:fabIn .4s var(--ease) both;
}
@keyframes fabIn{from{transform:scale(.4) translateY(20px);opacity:0} to{transform:none;opacity:1}}
.fab:active{transform:scale(.9);}
.fab svg{width:25px;height:25px;}

/* ---------- empty ---------- */
.empty{padding:56px 34px;text-align:center;color:var(--muted);animation:fadeUp .4s var(--ease) both;}
.empty .ico{width:66px;height:66px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px;}
.empty .ico svg{width:30px;height:30px;}
.empty h3{margin:0 0 6px;font-size:calc(16.5px*var(--fs));color:var(--ink);font-weight:600;}
.empty p{margin:0;font-size:calc(13.5px*var(--fs));line-height:1.55;}

/* ---------- chat view ---------- */
.chat-head{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.chat-head .name{font-weight:600;font-size:calc(16px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-head .st{font-size:calc(11.5px*var(--fs));color:var(--muted);}
.chat-head .st.on{color:var(--accent);}
.wall{
  flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;position:relative;
  background-color:var(--wall);
  padding:10px 12px 6px;
}
.wall[data-wall="dots"]{background-image:radial-gradient(var(--wall-dot) 1.4px, transparent 1.5px);background-size:22px 22px;}
.wall[data-wall="waves"]{
  background-image:
    radial-gradient(circle at 50% 120%, transparent 46%, var(--wall-dot) 46.4%, transparent 47.4%),
    radial-gradient(circle at 50% 120%, transparent 64%, var(--wall-dot) 64.4%, transparent 65.4%),
    radial-gradient(circle at 50% 120%, transparent 82%, var(--wall-dot) 82.4%, transparent 83.4%);
  background-size:260px 260px;background-position:center bottom;
}
.wall[data-wall="grid"]{
  background-image:linear-gradient(var(--wall-dot) 1px, transparent 1px),linear-gradient(90deg,var(--wall-dot) 1px, transparent 1px);
  background-size:30px 30px;opacity:1;
}
.wall[data-wall="plain"]{background-image:none;}
.msgs{display:flex;flex-direction:column;gap:2px;min-height:100%;justify-content:flex-end;}
.day{align-self:center;margin:14px 0 10px;padding:4px 12px;border-radius:11px;background:color-mix(in srgb,var(--shell) 76%,transparent);backdrop-filter:blur(8px);color:var(--muted);font-size:11.5px;font-weight:600;}
.mrow{display:flex;padding:1px 0;animation:msgIn .34s var(--ease) both;}
@keyframes msgIn{from{opacity:0;transform:translate3d(0,12px,0) scale(.97)} to{opacity:1;transform:none}}
.mrow.out{justify-content:flex-end;}
.mrow.tail{margin-bottom:8px;}
.bubble{
  max-width:min(78%,330px);border-radius:19px;padding:8px 12px 7px;position:relative;
  box-shadow:var(--shadow-s);word-wrap:break-word;overflow-wrap:anywhere;
}
.mrow.in .bubble{background:var(--bubble-in);color:var(--bubble-in-ink);border-bottom-left-radius:7px;}
.mrow.out .bubble{background:linear-gradient(150deg,var(--bubble-out-a),var(--bubble-out-b));color:var(--bubble-out-ink);border-bottom-right-radius:7px;}
.mrow.in:not(.tail) .bubble{border-bottom-left-radius:19px;}
.mrow.out:not(.tail) .bubble{border-bottom-right-radius:19px;}
.bubble .txt{font-size:calc(15px*var(--fs));line-height:1.42;white-space:pre-wrap;}
.bubble .txt a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
.meta{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:2px;height:14px;float:right;margin-left:10px;position:relative;top:4px;}
.meta .t{font-size:10.5px;opacity:.72;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
.meta .tick{display:inline-flex;align-items:center;opacity:.85;}
.tick svg{width:15px;height:15px;}
.mrow.out .meta .tick.read{color:#8FF3E4;opacity:1;}
:root[data-theme="dark"] .mrow.out .meta .tick.read, :root:not([data-theme="light"]) .mrow.out .meta .tick.read{color:#04312B;opacity:.95;}
.bubble.media{padding:4px;overflow:hidden;}
.bubble.media .meta{position:absolute;right:9px;bottom:9px;margin:0;float:none;top:auto;
  background:rgba(6,20,18,.5);backdrop-filter:blur(6px);padding:2px 7px;border-radius:9px;color:#fff;height:auto;}
.bubble.media .meta .t{opacity:.95;}
.bubble.media .meta .tick{color:#fff;}
.photo{display:block;border-radius:15px;max-width:100%;width:246px;height:auto;cursor:zoom-in;background:var(--surface-3);
  transition:transform .3s var(--ease), filter .3s var(--ease);}
.photo:active{transform:scale(.985);}
.bubble .cap{padding:5px 8px 3px;font-size:calc(14px*var(--fs));}

/* voice message */
.voice{display:flex;align-items:center;gap:10px;padding:2px 2px 2px 0;min-width:190px;}
.vplay{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;transition:transform .18s var(--ease);}
.vplay:active{transform:scale(.9);}
.mrow.in .vplay{background:var(--accent);color:var(--accent-ink);}
.mrow.out .vplay{background:rgba(255,255,255,.22);color:var(--bubble-out-ink);}
:root[data-theme="dark"] .mrow.out .vplay,:root:not([data-theme="light"]) .mrow.out .vplay{background:rgba(0,0,0,.18);}
.vplay svg{width:17px;height:17px;}
.vbody{flex:1;min-width:0;}
.wave{display:flex;align-items:center;gap:2px;height:26px;cursor:pointer;}
.wave i{flex:1;min-width:2px;max-width:3px;border-radius:2px;background:currentColor;opacity:.32;transition:opacity .12s linear, background .12s linear;}
.wave i.done{opacity:.95;}
.vfoot{display:flex;align-items:center;gap:6px;margin-top:1px;font-size:11px;opacity:.75;font-family:'JetBrains Mono',monospace;}
.bubble .voice + .meta{float:none;margin:0;justify-content:flex-end;top:0;}
.vdot{width:6px;height:6px;border-radius:50%;background:var(--ember);}

/* typing */
.typing-row{display:flex;padding:2px 0 8px;animation:msgIn .3s var(--ease) both;}
.typing{background:var(--bubble-in);border-radius:19px;border-bottom-left-radius:7px;padding:12px 14px;display:flex;gap:4px;box-shadow:var(--shadow-s);}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.25s infinite var(--ease);}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

/* system message */
.sys{align-self:center;margin:8px 0;padding:6px 13px;border-radius:12px;background:color-mix(in srgb,var(--shell) 80%,transparent);
  color:var(--muted);font-size:12px;text-align:center;max-width:80%;display:flex;align-items:center;gap:6px;}
.sys svg{width:14px;height:14px;flex:0 0 auto;}

/* ---------- composer ---------- */
.composer{
  flex:0 0 auto;padding:8px 10px calc(8px + var(--safe-b));background:var(--glass);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-top:1px solid var(--line-soft);
}
.cbar{display:flex;align-items:flex-end;gap:6px;}
.cfield{
  flex:1;display:flex;align-items:flex-end;gap:4px;background:var(--surface-2);border-radius:22px;
  padding:4px 4px 4px 6px;border:1px solid transparent;transition:border-color .2s var(--ease);
}
.cfield:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,transparent);}
.cfield textarea{
  flex:1;resize:none;max-height:120px;min-height:34px;padding:7px 2px;font-size:calc(15px*var(--fs));line-height:1.35;
}
.cfield textarea::placeholder{color:var(--faint);}
.send{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(145deg,var(--bubble-out-a),var(--bubble-out-b));color:var(--accent-ink);
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 34%,transparent);
  transition:transform .22s var(--ease), opacity .2s var(--ease);
}
.send:active{transform:scale(.88);}
.send svg{width:21px;height:21px;}
.send.mic{background:var(--surface-2);color:var(--ink-2);box-shadow:none;}
.send.rec{background:var(--ember);color:#fff;animation:recPulse 1.4s infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ember) 60%,transparent)}50%{box-shadow:0 0 0 12px transparent}}
.recbar{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;background:var(--ember-soft);border-radius:22px;flex:1;}
.recbar .blink{width:10px;height:10px;border-radius:50%;background:var(--ember);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.recbar .tm{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:14px;color:var(--ember);min-width:44px;}
.recbar .lvl{flex:1;display:flex;align-items:center;gap:2px;height:22px;}
.recbar .lvl i{flex:1;max-width:3px;border-radius:2px;background:var(--ember);opacity:.35;height:20%;transition:height .09s linear,opacity .09s linear;}
.recbar .cancel{color:var(--ember);font-weight:600;font-size:13.5px;padding:0 8px;}

/* attach sheet grid */
.att-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 4px 4px;}
.att{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:18px;background:var(--surface-2);
  transition:transform .18s var(--ease),background .18s var(--ease);}
.att:active{transform:scale(.94);}
.att .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;}
.att .ic svg{width:22px;height:22px;}
.att span{font-size:12px;font-weight:500;color:var(--ink-2);}

/* ---------- username / email fields ---------- */
.uwrap{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:14px;padding:0 14px;transition:border-color .2s var(--ease),background .2s var(--ease);}
.uwrap:focus-within{border-color:var(--accent);background:var(--surface);}
.uwrap.bad{border-color:var(--ember);}
.uwrap.ok{border-color:#31C48D;}
.uwrap .at{font-family:'JetBrains Mono',monospace;font-size:calc(15px*var(--fs));color:var(--faint);flex:0 0 auto;}
.uwrap input{flex:1;min-width:0;padding:12px 0;font-family:'JetBrains Mono',monospace;
  font-size:calc(15px*var(--fs));letter-spacing:-.01em;}
.ustat{display:flex;align-items:center;gap:6px;font-size:12.3px;margin-top:6px;color:var(--muted);min-height:18px;}
.ustat svg{width:14px;height:14px;flex:0 0 auto;}
.ustat.ok{color:#2C9E6B;}
.ustat.bad{color:var(--ember);}
:root[data-theme="dark"] .ustat.ok,:root:not([data-theme="light"]) .ustat.ok{color:#4FD79E;}
.ustat .spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);
  animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.hintline{font-size:12.3px;color:var(--faint);margin-top:6px;line-height:1.45;}

/* ---------- handle chip ---------- */
.handle{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-2);
  border-radius:11px;padding:5px 11px;font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:500;}
:root[data-theme="dark"] .handle,:root:not([data-theme="light"]) .handle{color:var(--accent);}
.row .uname{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--faint);}

/* ---------- friend requests ---------- */
.reqrow{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;
  animation:fadeUp .35s var(--ease) both;}
.reqrow .body{flex:1;min-width:0;}
.reqrow .body b{display:block;font-size:calc(15px*var(--fs));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reqrow .body small{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
.reqrow .acts{display:flex;gap:8px;flex:0 0 auto;}
.rb2{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;transition:transform .18s var(--ease);}
.rb2:active{transform:scale(.9);}
.rb2 svg{width:19px;height:19px;}
.rb2.y{background:var(--accent);color:var(--accent-ink);}
.rb2.n{background:var(--surface-3);color:var(--muted);}

/* ---------- find result ---------- */
.findcard{margin-top:14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;
  padding:16px;box-shadow:var(--shadow-s);animation:fadeUp .34s var(--ease) both;}
.findcard .top{display:flex;align-items:center;gap:13px;}
.findcard .who{flex:1;min-width:0;}
.findcard .who b{display:block;font-size:calc(16px*var(--fs));font-weight:600;}
.findcard .who small{display:block;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);margin-top:1px;}
.findcard .bio{color:var(--muted);font-size:calc(13.3px*var(--fs));line-height:1.5;margin-top:10px;}
.findcard .btn-row{margin-top:14px;}
.findmsg{margin-top:14px;display:flex;align-items:flex-start;gap:10px;padding:14px;border-radius:18px;
  background:var(--surface-2);color:var(--muted);font-size:13.2px;line-height:1.5;animation:fadeUp .3s var(--ease) both;}
.findmsg svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px;color:var(--faint);}
.findmsg.bad svg{color:var(--ember);}
.pillstate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent);}
.pillstate svg{width:15px;height:15px;}

/* ---------- accounts / login ---------- */
.pwrap{position:relative;}
.pwrap .inp{padding-right:48px;}
.pwrap .eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;
  border-radius:50%;display:grid;place-items:center;color:var(--faint);transition:color .18s var(--ease);}
.pwrap .eye:hover{color:var(--ink-2);}
.pwrap .eye svg{width:19px;height:19px;}
.acc{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:18px;background:var(--surface);
  border:1px solid var(--line-soft);box-shadow:var(--shadow-s);width:100%;text-align:left;margin-bottom:10px;
  transition:transform .18s var(--ease),border-color .18s var(--ease);}
.acc:active{transform:scale(.98);}
.acc:hover{border-color:color-mix(in srgb,var(--accent) 40%,transparent);}
.acc .t{flex:1;min-width:0;}
.acc .t b{display:block;font-weight:600;font-size:calc(15.5px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acc .t small{display:block;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);margin-top:1px;}
.acc .chev{width:18px;height:18px;color:var(--faint);flex:0 0 auto;}
.orline{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--faint);font-size:12px;
  text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.orline::before,.orline::after{content:'';flex:1;height:1px;background:var(--line);}
.checkrow{display:flex;align-items:center;gap:12px;padding:10px 2px 14px;width:100%;text-align:left;}
.checkrow .t{flex:1;min-width:0;}
.checkrow .t b{display:block;font-weight:500;font-size:calc(14.5px*var(--fs));}
.checkrow .t small{display:block;color:var(--muted);font-size:12.2px;margin-top:1px;line-height:1.4;}
.keybox{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;resize:none;min-height:110px;
  word-break:break-all;color:var(--ink-2);}
.lockhead{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:8px 0 22px;}
.lockhead .nm{font-family:'Unbounded',sans-serif;font-weight:600;font-size:calc(20px*var(--fs));letter-spacing:-.03em;}
.pwerr{color:var(--ember);font-size:12.8px;margin-top:8px;min-height:18px;display:flex;align-items:center;gap:6px;}
.pwerr svg{width:14px;height:14px;}

/* ---------- sheets & modals ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;animation:fadeIn .22s var(--ease) both;backdrop-filter:blur(2px);}
.scrim.out{animation:fadeOut .2s var(--ease) both;}
@keyframes fadeOut{to{opacity:0}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:26px 26px 0 0;padding:10px 16px calc(18px + var(--safe-b));
  box-shadow:var(--shadow-l);animation:sheetIn .38s var(--ease) both;max-height:86%;overflow-y:auto;
}
.sheet.out{animation:sheetOut .26s var(--ease-in) both;}
@keyframes sheetIn{from{transform:translate3d(0,100%,0)} to{transform:none}}
@keyframes sheetOut{to{transform:translate3d(0,100%,0)}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 14px;}
.sheet h2{margin:0 0 4px;font-size:calc(17px*var(--fs));font-weight:600;}
.sheet p.hint{margin:0 0 14px;color:var(--muted);font-size:calc(13px*var(--fs));line-height:1.5;}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:12px;}
.field .lab{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;}
.inp{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  font-size:calc(15px*var(--fs));transition:border-color .2s var(--ease),background .2s var(--ease);
}
.inp:focus{border-color:var(--accent);background:var(--surface);}
textarea.inp{resize:none;min-height:78px;line-height:1.45;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;
  background:linear-gradient(145deg,var(--bubble-out-a),var(--bubble-out-b));color:var(--accent-ink);
  font-weight:600;font-size:calc(15px*var(--fs));box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 30%,transparent);
  transition:transform .2s var(--ease),opacity .2s var(--ease);
}
.btn:active{transform:scale(.975);}
.btn[disabled]{opacity:.45;box-shadow:none;pointer-events:none;}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;}
.btn.danger{background:none;color:var(--danger);box-shadow:none;}
.btn svg{width:19px;height:19px;}
.btn-row{display:flex;gap:10px;}

/* ---------- settings ---------- */
.group{margin:14px 14px 0;background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-s);}
.srow{display:flex;align-items:center;gap:13px;padding:13px 14px;width:100%;text-align:left;position:relative;transition:background .16s var(--ease);}
.srow:active{background:var(--surface-2);}
.srow + .srow::before{content:'';position:absolute;left:52px;right:0;top:0;height:1px;background:var(--line-soft);}
.srow .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:0 0 auto;}
.srow .ic svg{width:17px;height:17px;}
.srow .t{flex:1;min-width:0;}
.srow .t b{display:block;font-weight:500;font-size:calc(14.8px*var(--fs));}
.srow .t small{display:block;color:var(--muted);font-size:calc(12.3px*var(--fs));margin-top:1px;}
.srow .val{color:var(--muted);font-size:calc(13.5px*var(--fs));flex:0 0 auto;}
.srow .chev{width:17px;height:17px;color:var(--faint);flex:0 0 auto;}
.gh{padding:20px 20px 7px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}

.switch{width:47px;height:28px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto;transition:background .26s var(--ease);}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .26s var(--ease);}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(19px);}

.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:3px;}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:calc(13px*var(--fs));font-weight:600;color:var(--muted);
  transition:background .22s var(--ease),color .22s var(--ease),box-shadow .22s var(--ease);}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s);}

.swatches{display:flex;gap:12px;padding:4px 0;}
.sw{width:42px;height:42px;border-radius:14px;position:relative;transition:transform .2s var(--ease);}
.sw:active{transform:scale(.9);}
.sw.on::after{content:'';position:absolute;inset:-4px;border-radius:18px;border:2px solid var(--accent);}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.wl{height:62px;border-radius:14px;border:2px solid transparent;background-color:var(--wall);overflow:hidden;position:relative;}
.wl.on{border-color:var(--accent);}
.wl .wall[data-wall="dots"]{background-size:11px 11px;}
.wl .wall[data-wall="grid"]{background-size:15px 15px;}
.wl .wall[data-wall="waves"]{background-size:96px 96px;}

/* ---------- profile ---------- */
.phead{
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 20px 22px;text-align:center;
  background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 13%,var(--shell)), var(--shell));
}
.phead .nm{font-family:'Unbounded',sans-serif;font-weight:600;font-size:calc(21px*var(--fs));letter-spacing:-.03em;}
.phead .bio{color:var(--muted);font-size:calc(13.8px*var(--fs));max-width:34ch;line-height:1.5;}
.pid{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-2);}
.pid svg{width:15px;height:15px;color:var(--accent);}
.pacts{display:flex;gap:10px;padding:0 16px;margin-top:-6px;}
.pact{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 6px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line-soft);color:var(--accent);font-size:12px;font-weight:600;
  box-shadow:var(--shadow-s);transition:transform .18s var(--ease);}
.pact:active{transform:scale(.95);}
.pact svg{width:21px;height:21px;}
.avedit{position:relative;}
.avedit .cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center;border:3px solid var(--shell);}
.avedit .cam svg{width:15px;height:15px;}

/* ---------- image viewer ---------- */
.viewer{position:absolute;inset:0;z-index:60;background:#06100E;display:flex;flex-direction:column;animation:vIn .3s var(--ease) both;}
@keyframes vIn{from{opacity:0;transform:scale(.94)} to{opacity:1;transform:none}}
.viewer.out{animation:vOut .24s var(--ease-in) both;}
@keyframes vOut{to{opacity:0;transform:scale(.94)}}
.viewer .vtop{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:calc(var(--safe-t) + 12px) 12px 12px;color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);transition:opacity .25s var(--ease);}
.viewer .vtop .icon-btn{color:#fff;}
.viewer .vtop .icon-btn:hover{background:rgba(255,255,255,.14);}
.viewer .vmeta{flex:1;min-width:0;}
.viewer .vmeta b{display:block;font-size:14.5px;font-weight:600;}
.viewer .vmeta small{color:rgba(255,255,255,.65);font-size:11.5px;}
.viewer .vstage{flex:1;display:grid;place-items:center;overflow:hidden;touch-action:none;}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;}
.viewer.hidechrome .vtop{opacity:0;pointer-events:none;}

/* ---------- calls ---------- */
.callscreen{
  position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;color:#fff;overflow:hidden;
  background:linear-gradient(165deg,#0B2622,#071614 55%,#0A1F2C);
  animation:callIn .42s var(--ease) both;
}
@keyframes callIn{from{opacity:0;transform:translate3d(0,26px,0) scale(.98)} to{opacity:1;transform:none}}
.callscreen.out{animation:callOut .3s var(--ease-in) both;}
@keyframes callOut{to{opacity:0;transform:translate3d(0,26px,0) scale(.98)}}
.callscreen .glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(58% 40% at 50% 36%, color-mix(in srgb,var(--accent) 34%,transparent), transparent 70%);}
#remoteVideo,#localVideo{position:absolute;object-fit:cover;background:#08110F;}
#remoteVideo{inset:0;width:100%;height:100%;}
#localVideo{right:14px;top:calc(var(--safe-t) + 74px);width:104px;height:150px;border-radius:18px;z-index:3;
  box-shadow:0 8px 24px rgba(0,0,0,.5);border:1.5px solid rgba(255,255,255,.18);transform:scaleX(-1);}
.callscreen[data-video="0"] #remoteVideo,.callscreen[data-video="0"] #localVideo{display:none;}
.cinfo{position:relative;z-index:4;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
.cbottom{margin-top:auto;position:relative;z-index:4;}
.cinfo .nm{font-family:'Unbounded',sans-serif;font-weight:600;font-size:25px;letter-spacing:-.03em;}
.cinfo .st{font-size:14px;color:rgba(255,255,255,.72);font-family:'JetBrains Mono',monospace;letter-spacing:.02em;}
.callscreen[data-video="1"] .cinfo{padding-top:calc(var(--safe-t) + 18px);}
.callscreen[data-video="1"] .cinfo .av{display:none;}
.callscreen[data-video="1"] .cinfo{background:linear-gradient(180deg,rgba(4,14,12,.65),transparent);
  position:absolute;left:0;right:0;top:0;padding-bottom:26px;}
.pulse{position:relative;}
.pulse::before,.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 60%,transparent);animation:ring 2.6s infinite var(--ease);}
.pulse::after{animation-delay:1.3s;}
@keyframes ring{from{transform:scale(1);opacity:.75} to{transform:scale(1.85);opacity:0}}
.callscreen.connected .pulse::before,.callscreen.connected .pulse::after{display:none;}
.cctl{position:relative;z-index:4;display:flex;justify-content:center;gap:16px;padding:24px 20px calc(34px + var(--safe-b));}
.cbtn{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.15);backdrop-filter:blur(12px);transition:transform .2s var(--ease),background .2s var(--ease);}
.cbtn:active{transform:scale(.9);}
.cbtn svg{width:25px;height:25px;}
.cbtn.off{background:#fff;color:#0B2622;}
.cbtn.end{background:#E33F3F;box-shadow:0 8px 24px rgba(227,63,63,.45);}
.cbtn.acc{background:#2ECC71;box-shadow:0 8px 24px rgba(46,204,113,.45);}
.cbtn small{position:absolute;bottom:-20px;font-size:10.5px;color:rgba(255,255,255,.7);white-space:nowrap;}
.cbtn-wrap{position:relative;display:grid;place-items:center;}
.callscreen .quality{position:relative;z-index:4;text-align:center;font-size:12px;line-height:1.5;color:rgba(255,255,255,.5);padding:0 32px 4px;}

/* incoming banner */
.incoming{
  position:absolute;left:10px;right:10px;top:calc(var(--safe-t) + 10px);z-index:75;
  background:var(--surface);border-radius:22px;padding:12px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-l);border:1px solid var(--line);animation:dropIn .42s var(--ease) both;
}
@keyframes dropIn{from{transform:translate3d(0,-130%,0);opacity:0} to{transform:none;opacity:1}}
.incoming .body{flex:1;min-width:0;}
.incoming .body b{display:block;font-size:15px;font-weight:600;}
.incoming .body small{color:var(--muted);font-size:12.5px;}
.incoming .acts{display:flex;gap:8px;}
.incoming .rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;}
.incoming .rb svg{width:20px;height:20px;}
.incoming .rb.y{background:#2ECC71;animation:wobble 1.6s infinite;}
.incoming .rb.n{background:#E33F3F;}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-12deg)}80%{transform:rotate(12deg)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}}

/* ---------- toast ---------- */
.toasts{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 22px);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.toasts.above-tabs{bottom:calc(var(--tab-h) + var(--safe-b) + 18px);}
.toast{background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--shell);padding:10px 16px;border-radius:14px;

.toast.has-action{pointer-events:auto;display:flex;align-items:center;gap:14px;text-align:left;padding:9px 9px 9px 16px;}
.toast .tact{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;
  padding:7px 13px;border-radius:10px;flex:0 0 auto;transition:transform .16s var(--ease);}
.toast .tact:active{transform:scale(.94);}
.toast.out{animation:toastOut .26s var(--ease-in) both;}
@keyframes toastIn{from{opacity:0;transform:translate3d(0,14px,0) scale(.94)} to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translate3d(0,10px,0) scale(.96)}}

.onb{flex:1;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 30px) 24px calc(24px + var(--safe-b));overflow-y:auto;}

.onb .logo svg{width:36px;height:36px;}
.onb h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:calc(31px*var(--fs));letter-spacing:-.045em;margin:0 0 8px;

.onb .form{animation:fadeUp .5s .18s var(--ease) both;}
.onb .pickav{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.onb .pickav .hintx{font-size:12.5px;color:var(--muted);line-height:1.45;}

/* connection pill */
.netpill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.netpill i{width:7px;height:7px;border-radius:50%;background:var(--faint);}
.netpill.ok i{background:#31C48D;box-shadow:0 0 0 3px color-mix(in srgb,#31C48D 22%,transparent);}
.netpill.bad i{background:var(--ember);}
.netpill.wait i{background:#E5B84B;animation:blink 1.2s infinite;}

/* result rows in search */
.hl{background:color-mix(in srgb,var(--accent) 26%,transparent);border-radius:3px;padding:0 1px;}

::-webkit-scrollbar{width:0;height:0;}

@media (prefers-reduced-motion: reduce){

const WDAYS=['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
const pad=n=>String(n).padStart(2,'0');
function hhmm(ts){ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function isSameDay(a,b){ const x=new Date(a),y=new Date(b); return x.toDateString()===y.toDateString(); }
function dayLabel(ts){
  const now=new Date(), d=new Date(ts);
  if(isSameDay(now,d)) return 'Сьогодні';
  const y=new Date(now); y.setDate(y.getDate()-1);
  if(isSameDay(y,d)) return 'Вчора';
  if(now-d < 6*864e5) return WDAYS[d.getDay()][0].toUpperCase()+WDAYS[d.getDay()].slice(1);
  return d.getDate()+' '+MONTHS[d.getMonth()]+(d.getFullYear()!==now.getFullYear()?' '+d.getFullYear():'');
}
function shortTime(ts){
  if(!ts) return '';
  const now=new Date(), d=new Date(ts);
  if(isSameDay(now,d)) return hhmm(ts);
  const y=new Date(now); y.setDate(y.getDate()-1);
  if(isSameDay(y,d)) return 'вчора';
  if(now-d < 6*864e5) return WDAYS[d.getDay()].slice(0,2);
  return pad(d.getDate())+'.'+pad(d.getMonth()+1);
}
function dur(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60); return m+':'+pad(sec%60); }
function durLong(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+':'+pad(m):m)+':'+pad(s); }
function plural(n,a,b,c){ const m=n%100; if(m>=11&&m<=14) return c; const k=n%10; return k===1?a:(k>=2&&k<=4?b:c); }

const GRADS=[['#0E9C8C','#0B6E7F'],['#C25E36','#93381F'],['#4C5FD7','#2E3B96'],['#A63D6E','#6E2247'],
             ['#2F8F4E','#1B6234'],['#B8892B','#8A5F16'],['#3C7FA8','#22536F'],['#7B4CC0','#4E2C87'],
             ['#C0435A','#8A2438'],['#2A9D8F','#1D6F65']];
function hashOf(s){ let h=0; s=String(s||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function gradOf(seed){ return GRADS[hashOf(seed)%GRADS.length]; }
function initials(name){
  const p=String(name||'?').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '?';
  return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();
}
function avatarHTML(person, size, online){
  const s=size||'m';
  const g=gradOf(person.id||person.name);
  const style=person.avatar?'':`background:linear-gradient(145deg,${g[0]},${g[1]})`;
  const inner=person.avatar?`<img src="${esc(person.avatar)}" alt="">`:esc(initials(person.name));
  return `<div class="avwrap"><div class="av ${s}" style="${style}">${inner}</div>${online?'<span class="dot-on"></span>':''}</div>`;
}
const USER_RE=/^[a-z][a-z0-9_]{2,19}$/;
const RESERVED=['admin','support','homin','me','you','root','system','null','undefined','help','info'];
function normUser(v){ return String(v||'').trim().toLowerCase().replace(/^@+/,'').replace(/[^a-z0-9_]/g,''); }
function validUser(v){ return USER_RE.test(v) && RESERVED.indexOf(v)<0; }
function idOf(u){ return 'homin-'+u; }
function userOf(id){ return String(id||'').replace(/^homin-/,''); }

function linkify(t){
  return esc(t).replace(/(https?:\/\/[^\s<]+)/g, u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
}

/* ---------- storage (safe: falls back to memory) ---------- */
const mem = {};
const store = {
  ok:(function(){ try{ const k='__homin'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })(),
  get(k,d){ try{ const v=this.ok?localStorage.getItem(k):mem[k]; return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ const s=JSON.stringify(v); try{ if(this.ok) localStorage.setItem(k,s); else mem[k]=s; }catch(e){ mem[k]=s; return false; } return true; },
  del(k){ try{ if(this.ok) localStorage.removeItem(k); }catch(e){} delete mem[k]; },
  keys(){ try{ return this.ok?Object.keys(localStorage):Object.keys(mem); }catch(e){ return Object.keys(mem); } }
};

/* ---------- state ---------- */
const DEFAULTS = {
  theme:'system', accent:'jade', wall:'dots', fontScale:1,
  enterToSend:true, sounds:true, animations:true, readReceipts:true, autoConnect:true
};
/* Налаштування вигляду належать пристрою, а не акаунту. */
const S = {
  me: null,
  chats: {},
  calls: [],
  cfg: Object.assign({}, DEFAULTS, store.get('homin.cfg', {})),
  active: null,
  net:'off',
  search:'',
  drafts:{},
  playing:null
};

let saveTimer=null;
function save(){
  store.set('homin.cfg', S.cfg);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ if(window.H.auth) window.H.auth.persist(); }, 260);
}
function trimChats(chats, dropMedia){
  const out={};
  for(const id in chats){
    const c=chats[id];
    out[id]=Object.assign({},c,{
      typing:false,
      messages:c.messages.slice(-160).map(m=>{
        const n=Object.assign({},m);
        if(dropMedia && (n.type==='image'||n.type==='voice')) n.src=null;
        return n;
      })
    });
  }
  return out;
}

function chatList(){
  const ids = Object.keys(S.chats);
  ids.sort((a,b)=>{
    const A=S.chats[a],B=S.chats[b];
    if(!!B.pinned - !!A.pinned) return (B.pinned?1:0)-(A.pinned?1:0);
    return (lastTs(B)||0)-(lastTs(A)||0);
  });
  return ids.map(id=>S.chats[id]);
}
function lastTs(c){ const m=c.messages[c.messages.length-1]; return m?m.ts:(c.created||0); }
function lastMsg(c){ return c.messages[c.messages.length-1]; }
function totalUnread(){ return Object.values(S.chats).reduce((n,c)=>n+(c.unread||0),0); }

/* ---------- theme ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(S.cfg.theme==='system') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', S.cfg.theme);
  r.setAttribute('data-accent', S.cfg.accent);
  r.style.setProperty('--fs', S.cfg.fontScale);
  const dark = S.cfg.theme==='dark' || (S.cfg.theme==='system' && matchMedia('(prefers-color-scheme: dark)').matches);
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', dark?'#0A100F':'#E9F0EE');
  if(!S.cfg.animations) r.style.setProperty('--ease','linear');
}

/* ---------- toast ---------- */
function toast(msg, ms, action){
  const wrap=$('#toasts'); if(!wrap) return;
  const t=document.createElement('div');
  t.className='toast'+(action?' has-action':'');
  const span=document.createElement('span'); span.textContent=msg; t.appendChild(span);
  const close=()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),260); };
  if(action){
    const b=document.createElement('button');
    b.className='tact'; b.textContent=action.label;
    b.addEventListener('click',()=>{ close(); action.fn&&action.fn(); });
    t.appendChild(b);
  }
  wrap.appendChild(t);
  setTimeout(close, ms||2100);
  return t;
}

/* ---------- haptics ---------- */
function buzz(p){ try{ if(navigator.vibrate && S.cfg.sounds) navigator.vibrate(p||8); }catch(e){} }

/* ---------- sheets ---------- */
let sheetEl=null, scrimEl=null;
function openSheet(html, onMount){
  closeSheet(true);
  const ov=$('#overlays');
  scrimEl=document.createElement('div'); scrimEl.className='scrim';
  sheetEl=document.createElement('div'); sheetEl.className='sheet';
  sheetEl.innerHTML=`<div class="grab"></div>`+html;
  ov.appendChild(scrimEl); ov.appendChild(sheetEl);
  scrimEl.addEventListener('click', ()=>closeSheet());
  if(onMount) onMount(sheetEl);
  return sheetEl;
}
function closeSheet(instant){
  if(!sheetEl) return;
  const s=sheetEl, c=scrimEl; sheetEl=null; scrimEl=null;
  if(instant){ s.remove(); c&&c.remove(); return; }
  s.classList.add('out'); c&&c.classList.add('out');
  setTimeout(()=>{ s.remove(); c&&c.remove(); }, 280);
}

/* ---------- navigation ---------- */
const SCREENS={};       // name -> {render(params), mount(root,params), tab?}
const stack=[];         // [{name, params, el}]
let busy=false;

function screenEl(name, params){
  const d=document.createElement('section');
  d.className='screen'+(SCREENS[name].tab?' tabroot':'');
  d.dataset.screen=name;
  d.innerHTML=SCREENS[name].render(params||{});
  return d;
}
function mountScreen(entry){
  const m=SCREENS[entry.name].mount;
  if(m) m(entry.el, entry.params||{});
}
function current(){ return stack[stack.length-1]; }

function go(name, params){
  if(busy||!SCREENS[name]) return;
  busy=true;
  const prev=current();
  const el=screenEl(name, params);
  $('#screens').appendChild(el);
  const entry={name, params:params||{}, el};
  stack.push(entry);
  mountScreen(entry);
  if(prev && S.cfg.animations){
    el.classList.add('anim-pushIn'); prev.el.classList.add('anim-pushOut');
    setTimeout(()=>{ el.classList.remove('anim-pushIn'); prev.el.classList.remove('anim-pushOut'); prev.el.hidden=true; busy=false; }, 340);
  } else {
    if(prev) prev.el.hidden=true;
    busy=false;
  }
  syncTabbar();
}
function back(){
  if(busy||stack.length<2) return;
  busy=true;
  const top=stack.pop(); const prev=current();
  prev.el.hidden=false;
  if(S.cfg.animations){
    top.el.classList.add('anim-popOut'); prev.el.classList.add('anim-popIn');
    setTimeout(()=>{ top.el.remove(); prev.el.classList.remove('anim-popIn'); busy=false; onShow(prev); }, 300);
  } else { top.el.remove(); busy=false; onShow(prev); }
  syncTabbar();
}
function onShow(entry){
  const f=SCREENS[entry.name].onShow;
  if(f) f(entry.el, entry.params);
}
function resetTo(name, params){
  stack.splice(0).forEach(e=>e.el.remove());
  go(name, params);
}
function refresh(){
  const c=current(); if(!c) return;
  const old=c.el;
  const prevScroll = old.querySelector('.scroll') ? old.querySelector('.scroll').scrollTop : 0;
  /* replace the element so delegated listeners are not attached twice */
  const el=screenEl(c.name, c.params);
  old.replaceWith(el);
  c.el=el;
  mountScreen(c);
  const sc=el.querySelector('.scroll'); if(sc) sc.scrollTop=prevScroll;
}
function syncTabbar(){
  const c=current();
  const tb=$('#tabbar');
  const isTab = c && SCREENS[c.name].tab;
  tb.hidden = !isTab;
  $$('.tab', tb).forEach(b=>b.classList.toggle('on', isTab && b.dataset.tab===c.name));
  const tz=$('#toasts'); if(tz) tz.classList.toggle('above-tabs', !!isTab);
  const n=totalUnread(), cnt=$('#tabUnread');
  cnt.hidden = n===0; cnt.textContent = n>99?'99+':n;
}
function switchTab(name){
  if(busy) return;
  const c=current();
  if(c && c.name===name){ const sc=c.el.querySelector('.scroll'); if(sc) sc.scrollTo({top:0,behavior:'smooth'}); return; }
  stack.splice(0).forEach(e=>e.el.remove());
  const el=screenEl(name,{});
  $('#screens').appendChild(el);
  const entry={name, params:{}, el};
  stack.push(entry); mountScreen(entry);
  if(S.cfg.animations){ el.classList.add('anim-fade'); setTimeout(()=>el.classList.remove('anim-fade'),240); }
  syncTabbar();
}

/* expose */
window.H = { ic, ICONS, $, $$, esc, uid, clamp, sleep, hhmm, dayLabel, shortTime, dur, durLong, plural,
  isSameDay, avatarHTML, initials, gradOf, hashOf, linkify, store, S, save, chatList, lastMsg, lastTs,
  totalUnread, applyTheme, toast, buzz, openSheet, closeSheet, SCREENS, stack, go, back, refresh,
  normUser, validUser, idOf, userOf, USER_RE, RESERVED,
  switchTab, current, resetTo, syncTabbar, DEFAULTS, trimChats, MONTHS };
})();
</script>
<script>
/* ============================================================
   ГОМІН — акаунти: реєстрація, вхід, пароль, ключ переносу
   Дані акаунта шифруються AES-GCM ключем, похідним від пароля
   (PBKDF2, 150 000 ітерацій). Пароль ніде не зберігається.
   ============================================================ */
(function(){
'use strict';
const {S, store, save, trimChats, DEFAULTS, uid, userOf} = window.H;

const ACCOUNTS='homin.accounts', SESSION='homin.session';
const dataKey = u => 'homin.acc.'+u;
const rememberKey = u => 'homin.keep.'+u;

const TE=new TextEncoder(), TD=new TextDecoder();
const subtle = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;

function b64(buf){
  const a = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s=''; for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null, a.subarray(i,i+0x8000));
  return btoa(s);
}
function unb64(s){
  const bin=atob(s), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
function randomBytes(n){
  const a=new Uint8Array(n);
  if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else for(let i=0;i<n;i++) a[i]=Math.floor(Math.random()*256);
  return a;
}

/* Запасний варіант, якщо WebCrypto недоступний (дуже рідко).
   Слабший за PBKDF2, але вхід усе одно працює. */
function weakBits(password, saltB64){
  const src=password+'|'+saltB64;
  const out=new Uint8Array(64);
  let h1=0x811c9dc5, h2=0x01000193;
  for(let round=0; round<4096; round++){
    for(let i=0;i<src.length;i++){
      h1=(h1^src.charCodeAt(i))>>>0; h1=Math.imul(h1,16777619)>>>0;
      h2=(h2+((h1^round)>>>0))>>>0; h2=Math.imul(h2,2246822519)>>>0;
    }
    out[round%64]=(out[round%64]^(h1&255)^(h2>>>8&255))&255;
  }
  return out;
}
async function deriveBits(password, saltB64){
  if(!subtle) return weakBits(password, saltB64);
  const base=await subtle.importKey('raw', TE.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits=await subtle.deriveBits(
    {name:'PBKDF2', salt:unb64(saltB64), iterations:150000, hash:'SHA-256'}, base, 512);
  return new Uint8Array(bits);
}
async function keyFromBits(bits){
  if(!subtle) return null;
  return subtle.importKey('raw', bits.slice(0,32), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
}
async function verifierOf(bits){
  const tail=bits.slice(32,64);
  if(!subtle) return b64(tail);
  return b64(await subtle.digest('SHA-256', tail));
}
async function seal(key, text){
  if(!key) return {v:0, plain:text};
  const iv=randomBytes(12);
  const ct=await subtle.encrypt({name:'AES-GCM', iv}, key, TE.encode(text));
  return {v:1, iv:b64(iv), ct:b64(ct)};
}
async function open_(key, blob){
  if(!blob) return null;
  if(blob.v===0 || blob.plain!=null) return blob.plain;
  if(!key) throw new Error('no-key');
  const pt=await subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, key, unb64(blob.ct));
  return TD.decode(pt);
}

/* ---------- session ---------- */
let sess = null;   // {username, bits, key}

function accounts(){ return store.get(ACCOUNTS, []) || []; }
function saveAccounts(list){ store.set(ACCOUNTS, list); }
function findAcc(u){ return accounts().find(a=>a.username===u) || null; }
function upsertAcc(rec){
  const list=accounts().filter(a=>a.username!==rec.username);
  list.unshift(rec); saveAccounts(list);
}

function applyData(data){
  S.me = data.me || null;
  S.chats = data.chats || {};
  S.calls = data.calls || [];
  Object.keys(S.chats).forEach(id=>{
    const c=S.chats[id];
    if(c.demo){ delete S.chats[id]; return; }
    if(!c.username) c.username=userOf(id);
    c.typing=false; c.online=false;
  });
}
function currentData(dropMedia){
  return { me:S.me, chats:trimChats(S.chats, !!dropMedia), calls:S.calls.slice(0,120) };
}

async function persist(){
  if(!sess || !S.me) return;
  const key=sess.key;
  let blob=await seal(key, JSON.stringify(currentData(false)));
  if(!store.set(dataKey(sess.username), blob)){
    blob=await seal(key, JSON.stringify(currentData(true)));
    store.set(dataKey(sess.username), blob);
  }
  const rec=findAcc(sess.username);
  if(rec && S.me){
    if(rec.name!==S.me.name || rec.avatar!==S.me.avatar){
      rec.name=S.me.name; rec.avatar=S.me.avatar; upsertAcc(rec);
    }
  }
}

async function startSession(username, bits, remember){
  sess={username, bits, key:await keyFromBits(bits)};
  store.set(SESSION, username);
  if(remember) store.set(rememberKey(username), b64(bits));
  else store.del(rememberKey(username));
}

const auth = {
  hasAccounts(){ return accounts().length>0; },
  accounts,
  username(){ return sess ? sess.username : null; },
  remembered(){ return sess ? !!store.get(rememberKey(sess.username), null) : false; },
  persist,

  /* ---- реєстрація ---- */
  async signup(o){
    const salt=b64(randomBytes(16));
    const bits=await deriveBits(o.password, salt);
    const verifier=await verifierOf(bits);
    const rec={username:o.username, name:o.name, avatar:o.avatar||null, salt, verifier, created:Date.now()};
    upsertAcc(rec);
    S.me={ id:'homin-'+o.username, username:o.username, name:o.name,
           email:o.email||'', bio:o.bio||'В мережі через Гомін', avatar:o.avatar||null };
    S.chats={}; S.calls=[];
    await startSession(o.username, bits, o.remember!==false);
    await persist();
    return true;
  },

  /* ---- вхід ---- */
  async unlock(username, password, remember){
    const rec=findAcc(username);
    if(!rec) return 'no-account';
    const bits=await deriveBits(password, rec.salt);
    const verifier=await verifierOf(bits);
    if(verifier!==rec.verifier) return 'wrong-password';
    const key=await keyFromBits(bits);
    let data={};
    try{
      const blob=store.get(dataKey(username), null);
      const text=await open_(key, blob);
      data=text?JSON.parse(text):{};
    }catch(e){ return 'corrupt'; }
    if(!data.me) data.me={ id:'homin-'+username, username, name:rec.name||username, email:'', bio:'', avatar:rec.avatar||null };
    applyData(data);
    await startSession(username, bits, !!remember);
    return 'ok';
  },

  /* ---- автоматичний вхід, якщо просили запамʼятати ---- */
  async resume(){
    const u=store.get(SESSION, null);
    if(!u || !findAcc(u)) return false;
    const kept=store.get(rememberKey(u), null);
    if(!kept) return false;
    try{
      const bits=unb64(kept);
      const key=await keyFromBits(bits);
      const blob=store.get(dataKey(u), null);
      const text=await open_(key, blob);
      const data=text?JSON.parse(text):{};
      if(!data.me) return false;
      applyData(data);
      sess={username:u, bits, key};
      return true;
    }catch(e){ return false; }
  },

  logout(){
    const u=sess?sess.username:store.get(SESSION,null);
    if(u) store.del(rememberKey(u));
    store.del(SESSION);
    sess=null;
    S.me=null; S.chats={}; S.calls=[]; S.active=null; S.drafts={};
  },

  async changePassword(oldPass, newPass){
    if(!sess) return 'no-session';
    const rec=findAcc(sess.username);
    const oldBits=await deriveBits(oldPass, rec.salt);
    if(await verifierOf(oldBits) !== rec.verifier) return 'wrong-password';
    const salt=b64(randomBytes(16));
    const bits=await deriveBits(newPass, salt);
    rec.salt=salt; rec.verifier=await verifierOf(bits);
    upsertAcc(rec);
    sess.bits=bits; sess.key=await keyFromBits(bits);
    if(store.get(rememberKey(sess.username), null)) store.set(rememberKey(sess.username), b64(bits));
    await persist();
    return 'ok';
  },

  removeAccount(username){
    saveAccounts(accounts().filter(a=>a.username!==username));
    store.del(dataKey(username));
    store.del(rememberKey(username));
    if(store.get(SESSION,null)===username) store.del(SESSION);
    if(sess && sess.username===username){ sess=null; S.me=null; S.chats={}; S.calls=[]; }
  },

  /* ---- ключ переносу на інший пристрій ---- */
  async exportKey(){
    if(!sess) return null;
    const rec=findAcc(sess.username);
    const payload={ me:S.me, chats:trimChats(S.chats, true), calls:S.calls.slice(0,60) };
    const blob=await seal(sess.key, JSON.stringify(payload));
    if(!sess.key){
      return 'HOMIN1.'+btoa(unescape(encodeURIComponent(JSON.stringify(
        {u:sess.username, salt:rec.salt, plain:payload}))));
    }
    const outer={u:sess.username, salt:rec.salt, iv:blob.iv, ct:blob.ct};
    return 'HOMIN1.'+btoa(unescape(encodeURIComponent(JSON.stringify(outer))));
  },

  async importKey(text, password, remember){
    text=String(text||'').trim().replace(/\s+/g,'');
    if(text.indexOf('HOMIN1.')!==0) return 'bad-format';
    let outer;
    try{ outer=JSON.parse(decodeURIComponent(escape(atob(text.slice(7))))); }
    catch(e){ return 'bad-format'; }
    if(!outer || !outer.u || !outer.salt) return 'bad-format';
    const bits=await deriveBits(password, outer.salt);
    const key=await keyFromBits(bits);
    let data;
    if(outer.plain){ data=outer.plain; }
    else {
      try{ data=JSON.parse(await open_(key, {v:1, iv:outer.iv, ct:outer.ct})); }
      catch(e){ return 'wrong-password'; }
    }
    if(!data || !data.me) return 'bad-format';
    const rec={ username:outer.u, name:data.me.name, avatar:data.me.avatar||null,
                salt:outer.salt, verifier:await verifierOf(bits), created:Date.now() };
    upsertAcc(rec);
    applyData(data);
    await startSession(outer.u, bits, remember!==false);
    await persist();
    return 'ok';
  },

  /* ---- перенесення профілю зі старих версій (без пароля) ---- */
  legacy(){
    const me=store.get('homin.me', null);
    if(!me || !me.name) return null;
    return { me, chats:store.get('homin.chats', {})||{}, calls:store.get('homin.calls', [])||[] };
  },
  async adoptLegacy(password, remember){
    const old=auth.legacy(); if(!old) return 'none';
    const username=old.me.username || userOf(old.me.id||'') || ('user'+uid(4));
    const salt=b64(randomBytes(16));
    const bits=await deriveBits(password, salt);
    upsertAcc({username, name:old.me.name, avatar:old.me.avatar||null,
               salt, verifier:await verifierOf(bits), created:Date.now()});
    old.me.username=username; old.me.id='homin-'+username;
    if(!old.me.email) old.me.email='';
    applyData(old);
    await startSession(username, bits, remember!==false);
    await persist();
    store.del('homin.me'); store.del('homin.chats'); store.del('homin.calls'); store.del('homin.order');
    return 'ok';
  }
};

window.H.auth = auth;
})();

<script>
/* ============================================================
   ГОМІН — екрани: онбординг, чати, дзвінки, налаштування, профілі

(function(){
'use strict';
const {ic,$,$$,esc,uid,S,save,chatList,lastMsg,avatarHTML,shortTime,dur,durLong,plural,
       toast,buzz,openSheet,closeSheet,SCREENS,go,back,refresh,switchTab,current,applyTheme,
       hhmm,dayLabel,gradOf,store,DEFAULTS,resetTo,syncTabbar,
       normUser,validUser,idOf,userOf} = window.H;

/* ---------- username field (shared by onboarding & profile) ---------- */
function unameField(id, value, statusId){
  return `<div class="uwrap" id="${id}wrap"><span class="at">@</span>
    <input id="${id}" value="${esc(value||'')}" maxlength="20" autocomplete="off"
      autocapitalize="off" spellcheck="false" placeholder="ваш_юзернейм"></div>
    <div class="ustat" id="${statusId}"></div>`;
}
function statusHTML(state, u){
  if(state==='checking') return `<span class="spin"></span> Перевіряємо @${esc(u)}…`;
  if(state==='free') return `${ic('check')} @${esc(u)} вільний — він буде вашим`;
  if(state==='taken') return `${ic('x')} @${esc(u)} уже зайнятий, оберіть інший`;
  if(state==='unknown') return `${ic('info')} Не вдалося перевірити — немає зʼєднання`;
  if(state==='invalid') return `3–20 символів: латиниця, цифри та _, починається з літери`;
  return `3–20 символів: латиниця, цифри та _, починається з літери`;
}
function statusClass(state){ return state==='free'?'ok':(state==='taken'||state==='invalid')?'bad':''; }

/* live username checker bound to an input */
function bindUsername(root, inputId, statusId, onState, initial){
  const inp=$('#'+inputId, root), st=$('#'+statusId, root), wrap=$('#'+inputId+'wrap', root);
  let state = initial || 'idle', timer=null, seq=0;
  const paint=()=>{ st.className='ustat '+statusClass(state); st.innerHTML=statusHTML(state, normUser(inp.value));
    wrap.className='uwrap '+statusClass(state); if(onState) onState(state, normUser(inp.value)); };
  const run=()=>{
    const u=normUser(inp.value); const my=++seq;
    if(!validUser(u)){ state = u.length?'invalid':'idle'; paint(); return; }
    state='checking'; paint();
    window.H.net.checkUsername(u).then(r=>{ if(my!==seq) return; state=r; paint(); });
  };
  inp.addEventListener('input', ()=>{
    const n=normUser(inp.value);
    if(inp.value!==n){ const p=inp.selectionStart; inp.value=n; try{inp.setSelectionRange(p,p);}catch(e){} }
    clearTimeout(timer); state='idle'; paint();
    timer=setTimeout(run, 650);
  });
  paint();
  return { get state(){ return state; }, value:()=>normUser(inp.value), check:run };
}

/* ---------- shared bits ---------- */
function tick(status){
  if(status==='sending') return `<span class="tick">${ic('clock')}</span>`;
  if(status==='sent') return `<span class="tick">${ic('check')}</span>`;
  if(status==='delivered') return `<span class="tick">${ic('checks')}</span>`;
  if(status==='read') return `<span class="tick read">${ic('checks')}</span>`;
  return '';
}
window.H.tick = tick;

function previewOf(c){
  if(c.typing) return `<span class="pv" style="color:var(--accent);font-weight:600">друкує…</span>`;
  const m=lastMsg(c);
  if(!m) return `<span class="pv" style="color:var(--faint)">Немає повідомлень</span>`;
  const mine = m.from==='me';
  const t = (mine && m.type!=='call') ? `<span class="tick ${m.status==='read'?'read':''}">${
      m.status==='read'||m.status==='delivered'?ic('checks'):m.status==='sent'?ic('check'):ic('clock')}</span>` : '';
  let body;
  if(m.type==='image') body = ic('image')+' '+(m.text?esc(m.text):'Фото');
  else if(m.type==='voice') body = ic('mic')+' Голосове · '+dur(m.dur||0);
  else if(m.type==='call') body = ic(m.missed?'phoneOff':'phone')+' '+esc(m.text);
  else body = esc(m.text||'');
  return t+`<span class="pv">${body}</span>`;
}
function netPill(){
  const map={ok:['ok','у мережі'],wait:['wait','підключення…'],bad:['bad','немає мережі'],off:['','офлайн']};
  const [cls,label]=map[S.net]||map.off;
  return `<span class="netpill ${cls}"><i></i>${label}</span>`;
}
window.H.netPill = netPill;

/* ============================================================

SCREENS.onboard = {

          <div class="hintline">Не перевіряємо й нікуди не надсилаємо — зберігається лише на цьому пристрої.</div></label>
        <label class="field"><span class="lab">Про себе</span>
          <textarea class="inp" id="obBio" maxlength="140" placeholder="Кілька слів, які побачать інші"></textarea></label>
        <div class="field"><span class="lab">Пароль</span>${window.H.pwField('obPw','Мінімум 4 символи')}
          <div class="hintline">Ним ви входитимете в акаунт. Пароль ніде не зберігається — ним шифруються ваші дані на цьому пристрої, тож відновити його неможливо.</div></div>

  },
  mount(root){

    let avatar=null, uState='idle';
    const sync=()=>{
      const okName = name.value.trim().length>=2;
      const u = normUser(uinp.value);
      btn.disabled = !(okName && validUser(u) && (uState==='free'||uState==='unknown')
                       && pw.value.length>=4 && pw2.value.length>=4);
      const box=av.querySelector('.av');
      if(!avatar){ const g=gradOf(name.value||'me');

        box.textContent = window.H.initials(name.value||'?'); }
    };
    const uctl = bindUsername(root,'obUser','obUserStat',(st)=>{ uState=st; sync(); });
    name.addEventListener('input', ()=>{
      if(!uinp.value && !uinp.dataset.touched){
        const guess = translit(name.value);
        if(guess) { uinp.value=guess; }

    uinp.addEventListener('input', ()=>{ uinp.dataset.touched='1'; });

    [pw,pw2].forEach(el=>el.addEventListener('input',()=>{ window.H.showErr(root,'obErr',''); sync(); }));
    btn.addEventListener('click', async ()=>{
      const u=uctl.value();

      if(pw.value!==pw2.value){ window.H.showErr(root,'obErr','Паролі не збігаються'); return; }

      });
      buzz(12);
      resetTo('chats');
      setTimeout(()=>window.H.net.start(), 900);
    });
    root.addEventListener('click', e=>{
      const b=e.target.closest('[data-act="back"]'); if(b) back();
    });
    setTimeout(()=>name.focus(),350);
    sync();
  }
};
const TRANS={'а':'a','б':'b','в':'v','г':'h','ґ':'g','д':'d','е':'e','є':'ie','ж':'zh','з':'z','и':'y','і':'i',
  'ї':'i','й':'i','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
  'х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ь':'','ю':'iu','я':'ia','ы':'y','э':'e','ъ':''};
function translit(v){
  const s=String(v||'').trim().toLowerCase().split(/\s+/)[0]||'';
  let out=''; for(const ch of s) out += (TRANS[ch]!==undefined?TRANS[ch]:ch);
  out=normUser(out);
  return validUser(out)?out:'';
}

   CHATS

SCREENS.chats = {
  tab:true,
  render(){
    const q=normUser(S.search)||S.search.trim().toLowerCase();

    }
    if(q){
      const people=all.filter(c=>c.name.toLowerCase().includes(q)||(c.username||'').includes(q));
      const hits=[];
      all.forEach(c=>c.messages.forEach(m=>{
        if(m.type==='text' && m.text && m.text.toLowerCase().includes(q)) hits.push({c,m});
      }));
      if(!people.length && !hits.length){
        rows = `<div class="empty"><div class="ico">${ic('search')}</div><h3>Нічого не знайшли</h3>
          <p>Спробуйте інше слово — або знайдіть людину за юзернеймом.</p>

function rowHTML(c,q){

      <div class="line1"><span class="name">${name}</span>
        <span class="time">${m?shortTime(m.ts):''}</span></div>
      <div class="line2"><span class="prev">${previewOf(c)}</span>
        ${c.pinned?`<span class="pin">${ic('pin')}</span>`:''}
        ${c.unread?`<span class="badge ${c.muted?'muted':''}">${c.unread>99?'99+':c.unread}</span>`:''}</div>
    </div></button>`;
}
function reqRowHTML(c){
  return `<div class="reqrow">
    ${avatarHTML(c,'m',c.online)}

function msgHitHTML(c,m,q){
  const t=m.text||''; const i=t.toLowerCase().indexOf(q);

  const frag=(from?'…':'')+esc(t.slice(from,i))+'<span class="hl">'+esc(t.slice(i,i+q.length))+'</span>'+esc(t.slice(i+q.length,i+q.length+40));

const ACCENTS=[['jade','#0E9C8C','#0B6E7F'],['ember','#C25E36','#93381F'],['indigo','#4C5FD7','#2E3B96'],['plum','#A63D6E','#6E2247']];
const WALLS=[['dots','Крапки'],['waves','Хвилі'],['grid','Сітка'],['plain','Однотонні']];

SCREENS.settings = {
  tab:true,
  render(){
    const c=S.cfg;

    return `<header class="topbar"><div class="grow"><h1>Налаштування</h1></div></header>

    </div>`;
  },
  mount(root){
    root.addEventListener('click', e=>{
      const seg=e.target.closest('.seg button');
      if(seg){ const key=seg.closest('.seg').dataset.seg; const v=seg.dataset.v;
        S.cfg[key] = key==='fontScale'?parseFloat(v):v; save(); applyTheme(); refresh(); buzz(6); return; }
      /* .sw — інакше closest() дістає data-accent з кореня документа */
      const acc=e.target.closest('.sw[data-accent]');
      if(acc){ S.cfg.accent=acc.dataset.accent; save(); applyTheme(); refresh(); buzz(6); return; }
      const wl=e.target.closest('.wl');
      if(wl && wl.dataset.wall){ S.cfg.wall=wl.dataset.wall; save(); refresh(); buzz(6); return; }
      const tog=e.target.closest('[data-tog]');
      if(tog){ const k=tog.dataset.tog; S.cfg[k]=!S.cfg[k]; save(); applyTheme();
        tog.querySelector('.switch').classList.toggle('on', S.cfg[k]); buzz(6); return; }
      const b=e.target.closest('[data-act]'); if(!b) return;
      const a=b.dataset.act;
      if(a==='profile') go('profile');
      else if(a==='myid') window.H.shareId();
      else if(a==='reconnect'){ window.H.net.start(true); toast('Підключаємось…'); }
      else if(a==='about') aboutSheet();
      else if(a==='install') doInstall();
      else if(a==='iosinstall') iosSheet();
      else if(a==='manualinstall') manualSheet();
      else if(a==='update') doUpdate();
      else if(a==='key') window.H.accountSheets.key();
      else if(a==='password') window.H.accountSheets.password();
      else if(a==='switch') window.H.accountSheets.switch();
      else if(a==='logout') window.H.accountSheets.logout();
      else if(a==='wipe') window.H.accountSheets.remove();
    });
  }
};
function installRow(){
  const p=window.H.pwa;
  if(!p) return '';
  if(p.installed())
    return `<div class="srow"><span class="ic" style="background:#2F8F4E">${ic('check')}</span>
      <div class="t"><b>Встановлено на пристрій</b><small>Ви користуєтесь застосунком, а не вкладкою браузера</small></div></div>`;
  if(p.canInstall())
    return `<button class="srow" data-act="install"><span class="ic" style="background:#0E9C8C">${ic('down')}</span>
      <div class="t"><b>Встановити застосунок</b><small>Іконка на екрані, запуск на весь екран, робота офлайн</small></div>
      <span class="chev">${ic('chev')}</span></button>`;
  if(p.isIOS())
    return `<button class="srow" data-act="iosinstall"><span class="ic" style="background:#0E9C8C">${ic('down')}</span>
      <div class="t"><b>Додати на екран «Додому»</b><small>Кілька кроків у Safari</small></div>
      <span class="chev">${ic('chev')}</span></button>`;
  if(window.isSecureContext && p.reg)
    return `<button class="srow" data-act="manualinstall"><span class="ic" style="background:#0E9C8C">${ic('down')}</span>
      <div class="t"><b>Встановити застосунок</b><small>Через меню браузера — покажемо як</small></div>
      <span class="chev">${ic('chev')}</span></button>`;
  return `<div class="srow"><span class="ic" style="background:#6C7B77">${ic('info')}</span>
    <div class="t"><b>Потрібна адреса https://</b><small>Встановлення й офлайн-режим працюють лише на захищеному зʼєднанні або на localhost</small></div></div>`;
}
async function doInstall(){
  const r=await window.H.pwa.install();
  if(r==='accepted') toast('Встановлюємо…');
  else if(r==='dismissed') toast('Встановлення скасовано');
  else toast('Браузер зараз не пропонує встановлення');
}
async function doUpdate(){
  toast('Перевіряємо…', 1200);
  const r=await window.H.pwa.checkUpdate();
  if(r==='update') toast('Є нова версія', 8000, {label:'Оновити', fn:()=>window.H.pwa.applyUpdate()});
  else if(r==='current') toast('У вас найновіша версія');
  else if(r==='unsupported') toast('Офлайн-режим недоступний у цьому середовищі');
  else toast('Не вдалося перевірити — немає мережі');
}
